name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # ※もしご自身のメインブランチが master の場合は master に書き換えてください

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 秘密の金庫からキーを取り出して firebase-config.js を自動作成する
      - name: Create firebase-config.js
        run: |
          echo "${{ secrets.FIREBASE_CONFIG_JS }}" > firebase-config.js

      # 2. GitHub Pages用の設定とアップロード
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4